services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /app/db.sqlite
      SEEDS_PATH: /app/seeds/tickets.json
      METRICS_PATH: /data/processed/metrics.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-http://n8n:5678/webhook/ticket-events}
    volumes:
      - ./backend:/app
      - ./data/processed:/data/processed:ro

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: ${API_URL:-http://backend:8000}
      API_DOCS_URL: http://localhost:${BACKEND_PORT:-8000}/docs
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  n8n:
    image: n8nio/n8n:2.44.6
    entrypoint: ["sh", "-c"]
    command:
      - >
        n8n import:workflow --input=/workflows/workflow.json &&
        n8n publish:workflow --id=ticketEventsWf001 &&
        exec n8n start
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows

  etl:
    build: ./data
    profiles: ["etl"]
    volumes:
      - ./data:/data

volumes:
  n8n_data:
